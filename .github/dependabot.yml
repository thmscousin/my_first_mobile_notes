version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      # Ces bibliothèques évoluent ensemble : une seule PR suffit.
      androidx-compose:
        patterns:
          - "androidx.*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
