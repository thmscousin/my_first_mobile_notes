name: CI

on:
  pull_request:
  # Sur main, le cache Gradle est enregistré pour servir aux PR suivantes.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Valider le wrapper Gradle
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Formatage et analyse statique
        run: ./gradlew ktlintCheck detekt --continue

      - name: Android Lint
        run: ./gradlew lintDebug

      - name: Tests unitaires
        run: ./gradlew testDebugUnitTest

      - name: Build debug
        run: ./gradlew assembleDebug

      - name: Conserver les rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapports
          path: app/build/reports/
          retention-days: 7
